# CI: every push and pull request builds all three artifacts and runs the
# hardware-free regression suites, so build breaks and test failures surface
# before a release is tagged.
name: build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (DLL + tray app + installer)
        shell: cmd
        run: build.bat

      - name: Software regression tests
        shell: cmd
        run: tests\build.bat

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PSCam4Win-${{ github.sha }}
          path: |
            build/PSCam4Win.dll
            build/PSCam4WinTray.exe
            build/PSCam4Win-Setup.exe
          if-no-files-found: error
          retention-days: 14
