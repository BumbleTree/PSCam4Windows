# CI build: every push / PR compiles all three artifacts (unsigned) so build
# breaks surface immediately and SignPath's "trusted build system" requirement
# is met by a working GitHub Actions pipeline.
name: build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (DLL + tray app + installer)
        shell: cmd
        run: build.bat

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PSCam4Win-unsigned-${{ github.sha }}
          path: |
            build/PSCam4Win.dll
            build/PSCam4WinTray.exe
            build/PSCam4Win-Setup.exe
          if-no-files-found: error
          retention-days: 14
