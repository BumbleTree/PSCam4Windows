# Release: a pushed v* tag builds the installer, runs the regression suites,
# and attaches PSCam4Win-Setup.exe to the GitHub Release for that tag. The
# driver catalogs are self-signed; setup installs their certificates and
# uninstall removes them.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (DLL + tray app + installer)
        shell: cmd
        run: build.bat

      - name: Software regression tests
        shell: cmd
        run: tests\build.bat

      - name: Attach the installer to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/PSCam4Win-Setup.exe
          generate_release_notes: true
